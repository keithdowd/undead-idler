[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "undead-idler"
dynamic = ["version"]
description = "A local Windows tray utility for periodic F15 keyboard input."
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "undead_idler.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
